<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clock Plus · 个人空间</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-primary: #0b0b12;
      --bg-card: rgba(255, 255, 255, 0.022);
      --border-card: rgba(255, 255, 255, 0.08);
      --text-primary: #f0f0ff;
      --text-secondary: rgba(255, 255, 255, 0.55);
      --accent-pink: #ed6d8f;
      --accent-purple: #7b61ff;
      --shadow-heavy: 0 30px 60px -20px rgba(0, 0, 0, 0.9);
      --radius-card: 40px;
      --radius-btn: 60px;
      --font: 'Inter', system-ui, -apple-system, sans-serif;
    }

    /* ===== 关键修复：背景图放在 body 上，不会被遮住 ===== */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    body {
      font-family: var(--font);
      color: var(--text-primary);
      /* 背景图片 + 纯色兜底 */
      background: url('/BG.jpg'), #0b0b12;
      background-size: cover, cover;
      background-blend-mode: overlay;
      background-position: center, center;
      background-repeat: no-repeat, no-repeat;
      /* 固定背景，滚动时不移动 */
      background-attachment: fixed, fixed;
    }

    /* ===== 主滚动容器 ===== */
    .scroll-container {
      height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      scroll-behavior: smooth;
      position: relative;
      z-index: 1;
    }

    /* ===== 动态渐变光晕层（半透明，浮在图片上面） ===== */
    .bg-gradient {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at 20% 50%, rgba(123, 97, 255, 0.12) 0%, transparent 55%),
                  radial-gradient(ellipse at 80% 20%, rgba(237, 109, 143, 0.08) 0%, transparent 50%),
                  radial-gradient(ellipse at 50% 80%, rgba(123, 97, 255, 0.06) 0%, transparent 45%),
                  transparent;
      animation: gradientShift 12s ease-in-out infinite alternate;
    }

    @keyframes gradientShift {
      0% {
        background: radial-gradient(ellipse at 20% 50%, rgba(123, 97, 255, 0.15) 0%, transparent 55%),
                    radial-gradient(ellipse at 80% 20%, rgba(237, 109, 143, 0.10) 0%, transparent 50%),
                    radial-gradient(ellipse at 50% 80%, rgba(123, 97, 255, 0.06) 0%, transparent 45%),
                    transparent;
      }
      33% {
        background: radial-gradient(ellipse at 70% 30%, rgba(237, 109, 143, 0.14) 0%, transparent 50%),
                    radial-gradient(ellipse at 20% 70%, rgba(123, 97, 255, 0.10) 0%, transparent 55%),
                    radial-gradient(ellipse at 80% 80%, rgba(237, 109, 143, 0.06) 0%, transparent 45%),
                    transparent;
      }
      66% {
        background: radial-gradient(ellipse at 40% 80%, rgba(123, 97, 255, 0.13) 0%, transparent 50%),
                    radial-gradient(ellipse at 90% 50%, rgba(237, 109, 143, 0.10) 0%, transparent 55%),
                    radial-gradient(ellipse at 10% 20%, rgba(123, 97, 255, 0.08) 0%, transparent 45%),
                    transparent;
      }
      100% {
        background: radial-gradient(ellipse at 60% 10%, rgba(237, 109, 143, 0.12) 0%, transparent 50%),
                    radial-gradient(ellipse at 10% 60%, rgba(123, 97, 255, 0.14) 0%, transparent 55%),
                    radial-gradient(ellipse at 70% 90%, rgba(237, 109, 143, 0.06) 0%, transparent 45%),
                    transparent;
      }
    }

    /* ===== 星尘 Canvas ===== */
    #stardust-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* ===== 浮动装饰 ===== */
    .floating-deco {
      position: fixed;
      z-index: 1;
      pointer-events: none;
      border-radius: 50%;
      opacity: 0.45;
      will-change: transform, opacity;
    }
    .deco-1 {
      width: 140px;
      height: 140px;
      top: 5%;
      left: 3%;
      background: radial-gradient(circle, rgba(237, 109, 143, 0.30), transparent 70%);
      animation: floatAnim1 20s ease-in-out infinite alternate;
    }
    .deco-2 {
      width: 100px;
      height: 100px;
      bottom: 10%;
      right: 4%;
      background: radial-gradient(circle, rgba(123, 97, 255, 0.35), transparent 70%);
      animation: floatAnim2 16s ease-in-out infinite alternate;
      border-radius: 30% 70% 50% 50% / 50% 40% 60% 50%;
    }
    .deco-3 {
      width: 70px;
      height: 70px;
      top: 50%;
      left: 2%;
      border: 2px solid rgba(237, 109, 143, 0.20);
      background: transparent;
      animation: floatAnim3 22s ease-in-out infinite alternate;
    }
    .deco-4 {
      width: 50px;
      height: 50px;
      bottom: 25%;
      right: 10%;
      background: rgba(123, 97, 255, 0.15);
      animation: floatAnim4 14s ease-in-out infinite alternate;
      border-radius: 20% 80% 50% 50% / 50% 40% 60% 50%;
    }
    .deco-5 {
      width: 20px;
      height: 20px;
      top: 18%;
      right: 6%;
      background: rgba(237, 109, 143, 0.30);
      animation: floatAnim5 12s ease-in-out infinite alternate;
      box-shadow: 0 0 30px rgba(237, 109, 143, 0.10);
    }
    .deco-6 {
      width: 36px;
      height: 36px;
      top: 72%;
      left: 8%;
      animation: floatAnim6 19s ease-in-out infinite alternate;
      background: transparent;
      border-radius: 0;
      opacity: 0.25;
    }
    .deco-6::before,
    .deco-6::after {
      content: '';
      position: absolute;
      background: rgba(237, 109, 143, 0.4);
      border-radius: 2px;
    }
    .deco-6::before {
      width: 100%;
      height: 2px;
      top: 50%;
      left: 0;
      transform: translateY(-50%);
    }
    .deco-6::after {
      width: 2px;
      height: 100%;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
    }

    @keyframes floatAnim1 {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(30px, -40px) scale(1.1) rotate(12deg); }
    }
    @keyframes floatAnim2 {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(-25px, 30px) scale(1.15) rotate(-8deg); }
    }
    @keyframes floatAnim3 {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(20px, -25px) scale(0.9) rotate(10deg); }
    }
    @keyframes floatAnim4 {
      0% { transform: translate(0, 0) scale(1) rotate(0deg); }
      100% { transform: translate(-15px, 20px) scale(1.1) rotate(-6deg); }
    }
    @keyframes floatAnim5 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(10px, -15px) scale(1.3); }
    }
    @keyframes floatAnim6 {
      0% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(15px, -10px) rotate(20deg); }
    }

    /* =============================================
       第一屏（固定）
       ============================================= */
    .screen-top {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 5;
    }

    .glass-card {
      max-width: 580px;
      width: 100%;
      padding: 2.8rem 2.5rem 2rem;
      background: var(--bg-card);
      backdrop-filter: blur(8px) saturate(110%);
      -webkit-backdrop-filter: blur(16px) saturate(180%);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-card);
      box-shadow: var(--shadow-heavy), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      text-align: center;
      transform-style: preserve-3d;
      will-change: transform;
      transition: transform 0.1s ease;
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.7s cubic-bezier(0.23, 1, 0.32, 1),
                  transform 0.7s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .reveal-1 { transition-delay: 0.05s; }
    .reveal-2 { transition-delay: 0.15s; }
    .reveal-3 { transition-delay: 0.25s; }
    .reveal-4 { transition-delay: 0.35s; }
    .reveal-5 { transition-delay: 0.45s; }

    .avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      margin: 0 auto 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 12px 30px -6px rgba(237, 109, 143, 0.35);
      user-select: none;
      border: 2px solid rgba(255, 255, 255, 0.12);
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subhead {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-secondary);
      margin-bottom: 1.2rem;
      letter-spacing: 0.2px;
    }
    .subhead span {
      color: var(--accent-pink);
      font-weight: 500;
    }

    .divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      margin: 0 auto 1.2rem;
      border-radius: 10px;
    }

    .status {
      font-size: 0.8rem;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.3px;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4ade80;
      animation: pulse-dot 2s infinite;
    }
    @keyframes pulse-dot {
      0% { opacity: 0.3; transform: scale(0.85); }
      50% { opacity: 1; transform: scale(1.2); }
      100% { opacity: 0.3; transform: scale(0.85); }
    }

    /* ===== 浮动按钮（第一屏下方） ===== */
    .float-buttons {
      max-width: 580px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 12px;
      margin-top: 24px;
    }

    .float-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 14px 8px;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px) saturate(160%);
      -webkit-backdrop-filter: blur(12px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 18px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 0.85rem;
      text-decoration: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      min-height: 70px;
    }

    .float-btn:hover {
      background: rgba(237, 109, 143, 0.10);
      border-color: var(--accent-pink);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px -10px rgba(237, 109, 143, 0.20);
    }

    .float-btn .icon {
      font-size: 1.6rem;
      line-height: 1.2;
    }
    .float-btn .label {
      font-size: 0.7rem;
      letter-spacing: 0.5px;
      color: var(--text-secondary);
    }

    /* ===== 滚动提示 ===== */
    .scroll-hint {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: var(--text-secondary);
      font-size: 0.7rem;
      letter-spacing: 2px;
      opacity: 0.5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      pointer-events: none;
      transition: opacity 0.5s ease;
      z-index: 6;
    }
    .scroll-hint .arrow {
      display: block;
      width: 18px;
      height: 18px;
      border-right: 2px solid var(--text-secondary);
      border-bottom: 2px solid var(--text-secondary);
      transform: rotate(45deg);
      opacity: 0.5;
      animation: bounceArrow 2.5s ease-in-out infinite;
    }
    @keyframes bounceArrow {
      0%, 100% { transform: rotate(45deg) translate(0, 0); }
      50% { transform: rotate(45deg) translate(-3px, -3px); }
    }

    /* =============================================
       第二屏（从底部滑上来）
       ============================================= */
    .screen-bottom {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background: rgba(11, 11, 18, 0.45);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      margin-top: -8vh;
      padding-top: 12vh;
    }

    .grid-container {
      max-width: 780px;
      width: 100%;
      padding: 2rem;
      text-align: center;
    }

    .grid-container h2 {
      font-size: 1.8rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #ffffff 30%, var(--accent-pink));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease 0.3s forwards;
    }

    .grid-container p {
      color: var(--text-secondary);
      font-size: 0.95rem;
      margin-bottom: 2.5rem;
      letter-spacing: 0.3px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.8s ease 0.5s forwards;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .link-grid-expanded {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    .link-btn-large {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 24px 20px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 20px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 1.1rem;
      text-decoration: none;
      transition: all 0.3s ease;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
      min-height: 90px;
      opacity: 0;
      transform: translateY(30px) scale(0.95);
      animation: gridItemIn 0.6s ease forwards;
    }
    .link-btn-large:nth-child(1) { animation-delay: 0.6s; }
    .link-btn-large:nth-child(2) { animation-delay: 0.7s; }
    .link-btn-large:nth-child(3) { animation-delay: 0.8s; }
    .link-btn-large:nth-child(4) { animation-delay: 0.9s; }

    @keyframes gridItemIn {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .link-btn-large:hover {
      background: rgba(237, 109, 143, 0.12);
      border-color: var(--accent-pink);
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 16px 36px -12px rgba(237, 109, 143, 0.25);
    }

    .link-btn-large .icon {
      font-size: 2rem;
    }
    .link-btn-large .label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      line-height: 1.3;
    }
    .link-btn-large .label small {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--text-secondary);
      letter-spacing: 0.5px;
    }

    /* ===== 滚动条美化 ===== */
    .scroll-container::-webkit-scrollbar {
      width: 4px;
    }
    .scroll-container::-webkit-scrollbar-track {
      background: transparent;
    }
    .scroll-container::-webkit-scrollbar-thumb {
      background: rgba(237, 109, 143, 0.3);
      border-radius: 10px;
    }
    .scroll-container::-webkit-scrollbar-thumb:hover {
      background: rgba(237, 109, 143, 0.5);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 500px) {
      .glass-card {
        padding: 2rem 1.2rem 1.5rem;
        border-radius: 32px;
      }
      h1 {
        font-size: 2rem;
      }
      .avatar {
        width: 70px;
        height: 70px;
        font-size: 2.2rem;
      }
      .float-buttons {
        gap: 8px;
        margin-top: 18px;
      }
      .float-btn {
        padding: 10px 4px;
        min-height: 56px;
        border-radius: 14px;
        font-size: 0.7rem;
      }
      .float-btn .icon {
        font-size: 1.3rem;
      }
      .float-btn .label {
        font-size: 0.6rem;
      }
      .link-grid-expanded {
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .link-btn-large {
        padding: 14px 10px;
        font-size: 0.85rem;
        min-height: 70px;
        flex-direction: column;
        gap: 4px;
      }
      .link-btn-large .label {
        align-items: center;
      }
      .link-btn-large .icon {
        font-size: 1.6rem;
      }
      .deco-2, .deco-3, .deco-4, .deco-6 {
        display: none;
      }
      .screen-bottom {
        margin-top: -4vh;
        padding-top: 8vh;
      }
    }

    @media (max-width: 400px) {
      .float-buttons {
        gap: 6px;
      }
      .float-btn {
        padding: 8px 4px;
        min-height: 48px;
        border-radius: 12px;
        font-size: 0.6rem;
      }
      .float-btn .icon {
        font-size: 1.1rem;
      }
      .float-btn .label {
        font-size: 0.5rem;
      }
      .link-grid-expanded {
        gap: 8px;
      }
      .link-btn-large {
        padding: 10px 6px;
        font-size: 0.75rem;
        min-height: 60px;
        border-radius: 14px;
      }
      .link-btn-large .icon {
        font-size: 1.3rem;
      }
    }
  </style>
</head>
<body>

  <!-- 动态渐变光晕层（在图片之上） -->
  <div class="bg-gradient"></div>

  <!-- 星尘粒子 Canvas -->
  <canvas id="stardust-canvas"></canvas>

  <!-- 浮动装饰 -->
  <div class="floating-deco deco-1"></div>
  <div class="floating-deco deco-2"></div>
  <div class="floating-deco deco-3"></div>
  <div class="floating-deco deco-4"></div>
  <div class="floating-deco deco-5"></div>
  <div class="floating-deco deco-6"></div>

  <!-- ===== 主滚动容器 ===== -->
  <div class="scroll-container" id="scrollContainer">

    <!-- 第一屏（固定） -->
    <section class="screen-top" id="screen-top">
      <div class="glass-card" id="glassCard" data-tilt="true">
        <div class="avatar reveal reveal-1">⏰</div>
        <h1 class="reveal reveal-2">Clock Plus</h1>
        <p class="subhead reveal reveal-3">
          探索 · 创造 · <span>无限可能</span>
        </p>
        <div class="divider reveal reveal-3"></div>
        <div class="status reveal reveal-5">
          <span class="status-dot"></span>
          向下滚动探索
        </div>
      </div>

      <div class="float-buttons" id="floatButtons">
        <a href="/projects/" class="float-btn">
          <span class="icon">📂</span>
          <span class="label">项目</span>
        </a>
        <a href="https://github.com/clockplus" target="_blank" class="float-btn">
          <span class="icon">🐙</span>
          <span class="label">GitHub</span>
        </a>
        <a href="https://www.bilibili.com/video/BV1ts411D7mf/?spm_id_from=333.1387.favlist.content.click&vd_source=6216da85b6c59cc8c014649b6caa1ad1" class="float-btn">
          <span class="icon">_(:з」∠)_</span>
          <span class="label">累</span>
        </a>
        <a href="https://www.bilibili.com/video/BV1GJ411x7h7/?spm_id_from=333.337.search-card.all.click&vd_source=6216da85b6c59cc8c014649b6caa1ad1" class="float-btn">
          <span class="icon">❤️</span>
          <span class="label"好康的</span>
        </a>
      </div>

      <div class="scroll-hint" id="scrollHint">
        <span>向下滚动</span>
        <span class="arrow"></span>
      </div>
    </section>

    <!-- 第二屏 -->
    <section class="screen-bottom" id="screen-bottom">
      <div class="grid-container">
        <h2>✦ 探索更多</h2>
        <p>项目 · 代码 · 灵感</p>
        <div class="link-grid-expanded">
          <a href="/projects/" class="link-btn-large">
            <span class="icon">📂</span>
            <span class="label">
              项目
              <small>Works</small>
            </span>
          </a>
          <a href="https://github.com/clockplus" target="_blank" class="link-btn-large">
            <span class="icon">🐙</span>
            <span class="label">
              GitHub
              <small>Repos</small>
            </span>
          </a>
          <a href="#" class="link-btn-large">
            <span class="icon">📝</span>
            <span class="label">
              博客
              <small>Blog</small>
            </span>
          </a>
          <a href="#" class="link-btn-large">
            <span class="icon">💬</span>
            <span class="label">
              联系
              <small>Contact</small>
            </span>
          </a>
        </div>
      </div>
    </section>

  </div>

  <script>
    (function() {
      'use strict';

      // =============================================
      // 1. 星尘粒子
      // =============================================
      const canvas = document.getElementById('stardust-canvas');
      const ctx = canvas.getContext('2d');
      let width, height;
      let particles = [];

      function resizeCanvas() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
      }
      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      const PARTICLE_COUNT = 55;
      const colors = ['rgba(237, 109, 143, 0.5)', 'rgba(123, 97, 255, 0.5)', 'rgba(255,255,255,0.25)'];

      class Star {
        constructor() { this.reset(); }
        reset() {
          this.x = Math.random() * width;
          this.y = Math.random() * height;
          this.size = Math.random() * 3 + 1.2;
          this.speedX = (Math.random() - 0.5) * 0.2;
          this.speedY = (Math.random() - 0.5) * 0.2;
          this.opacity = Math.random() * 0.6 + 0.2;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.twinkleSpeed = Math.random() * 0.02 + 0.008;
          this.twinkleOffset = Math.random() * Math.PI * 2;
          this.baseX = this.x;
          this.baseY = this.y;
        }
        update(time, scrollProgress) {
          this.x += this.speedX;
          this.y += this.speedY;
          if (this.x < 0 || this.x > width) this.speedX *= -1;
          if (this.y < 0 || this.y > height) this.speedY *= -1;
          const driftX = (this.baseX - width/2) * scrollProgress * 0.02;
          const driftY = (this.baseY - height/2) * scrollProgress * 0.02;
          this.currentX = this.x + driftX;
          this.currentY = this.y + driftY;
          this.currentOpacity = this.opacity * (0.6 + 0.4 * Math.sin(time * this.twinkleSpeed + this.twinkleOffset));
          this.currentOpacity *= (1 - scrollProgress * 0.2);
        }
        draw() {
          ctx.beginPath();
          ctx.arc(this.currentX, this.currentY, this.size, 0, Math.PI * 2);
          ctx.fillStyle = this.color;
          ctx.globalAlpha = this.currentOpacity;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        particles.push(new Star());
      }

      let scrollProgress = 0;

      function animateStars(time) {
        ctx.clearRect(0, 0, width, height);
        particles.forEach(p => {
          p.update(time, scrollProgress);
          p.draw();
        });
        requestAnimationFrame(animateStars);
      }
      animateStars(0);

      // =============================================
      // 2. 滚动驱动效果
      // =============================================
      const container = document.getElementById('scrollContainer');
      const glassCard = document.getElementById('glassCard');
      const floatButtons = document.getElementById('floatButtons');
      const scrollHint = document.getElementById('scrollHint');
      const decos = document.querySelectorAll('.floating-deco');
      const screenBottom = document.getElementById('screen-bottom');

      function updateScrollEffects() {
        const scrollY = container.scrollTop;
        const windowHeight = window.innerHeight;
        const progress = Math.min(scrollY / windowHeight, 1);
        scrollProgress = progress;

        if (glassCard) {
          const opacity = 1 - progress * 0.3;
          glassCard.style.opacity = opacity;
        }
        if (floatButtons) {
          const opacity = 1 - progress * 0.3;
          floatButtons.style.opacity = opacity;
        }
        if (scrollHint) {
          scrollHint.style.opacity = 1 - progress * 1.5;
        }

        decos.forEach((el, i) => {
          const yMove = progress * (15 + i * 5);
          const scaleVal = 1 + progress * 0.08 * (i % 2 === 0 ? 1 : -1);
          const opacityVal = 0.45 - progress * 0.2;
          el.style.transform = `translateY(${yMove}px) scale(${scaleVal})`;
          el.style.opacity = Math.max(opacityVal, 0.1);
        });

        if (screenBottom) {
          const blurOpacity = Math.min(progress * 1.2, 0.85);
          screenBottom.style.background = `rgba(11, 11, 18, ${blurOpacity * 0.65})`;
          screenBottom.style.backdropFilter = `blur(${progress * 20}px) saturate(180%)`;
          screenBottom.style.WebkitBackdropFilter = `blur(${progress * 20}px) saturate(180%)`;
        }
      }

      container.addEventListener('scroll', updateScrollEffects, { passive: true });
      setTimeout(updateScrollEffects, 50);

      // =============================================
      // 3. 入场动画
      // =============================================
      const revealElements = document.querySelectorAll('.reveal');
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.15, rootMargin: '0px 0px -40px 0px' });
      revealElements.forEach(el => observer.observe(el));

      // =============================================
      // 4. 3D卡片倾斜
      // =============================================
      const card = document.querySelector('[data-tilt="true"]');
      if (card) {
        const MAX_ROTATE_X = 6;
        const MAX_ROTATE_Y = 6;
        let currentRotateX = 0, currentRotateY = 0;
        let targetRotateX = 0, targetRotateY = 0;
        let tiltActive = true;

        card.addEventListener('mouseenter', () => {
          card.style.transition = 'none';
        });

        card.addEventListener('mousemove', (e) => {
          const progress = Math.min(container.scrollTop / window.innerHeight, 1);
          tiltActive = progress < 0.15;
          if (!tiltActive) return;
          const rect = card.getBoundingClientRect();
          const x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
          const y = ((e.clientY - rect.top) / rect.height) * 2 - 1;
          targetRotateY = x * MAX_ROTATE_Y;
          targetRotateX = -y * MAX_ROTATE_X;
        });

        card.addEventListener('mouseleave', () => {
          targetRotateX = 0;
          targetRotateY = 0;
          card.style.transition = 'transform 0.4s cubic-bezier(0.23, 1, 0.32, 1)';
        });

        function animateTilt() {
          const progress = Math.min(container.scrollTop / window.innerHeight, 1);
          tiltActive = progress < 0.15;

          if (tiltActive) {
            currentRotateX += (targetRotateX - currentRotateX) * 0.08;
            currentRotateY += (targetRotateY - currentRotateY) * 0.08;
            if (Math.abs(currentRotateX - targetRotateX) < 0.01) currentRotateX = targetRotateX;
            if (Math.abs(currentRotateY - targetRotateY) < 0.01) currentRotateY = targetRotateY;
          } else {
            currentRotateX += (0 - currentRotateX) * 0.08;
            currentRotateY += (0 - currentRotateY) * 0.08;
            if (Math.abs(currentRotateX) < 0.01) currentRotateX = 0;
            if (Math.abs(currentRotateY) < 0.01) currentRotateY = 0;
          }
          card.style.transform = `rotateX(${currentRotateX}deg) rotateY(${currentRotateY}deg)`;
          requestAnimationFrame(animateTilt);
        }
        animateTilt();
      }

    })();
  </script>
</body>
</html>
