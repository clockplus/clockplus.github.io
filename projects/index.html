<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的项目 · Clock Plus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* === 全局 === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f0f1a;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* === 板块一：项目列表（毛玻璃卡片） === */
    .glass-card {
      max-width: 800px;
      width: 100%;
      padding: 3rem 2.5rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      margin-bottom: 2rem;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
      background: linear-gradient(to right, #f0f0ff, #b7b7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .subhead {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 2.5rem;
      font-size: 1.05rem;
    }

    .project-item {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 1.5rem 1.8rem;
      margin-bottom: 1.2rem;
      transition: all 0.25s ease;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
    }

    .project-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(167, 139, 250, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px -10px rgba(0, 0, 0, 0.5);
    }

    .project-info {
      flex: 1 1 200px;
    }

    .project-info h3 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 0.3rem;
      color: #f0f0ff;
    }

    .project-info p {
      font-size: 0.95rem;
      color: rgba(255, 255, 255, 0.55);
      margin: 0;
    }

    .project-tag {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(106, 90, 205, 0.25);
      color: #a78bfa;
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      border: 1px solid rgba(106, 90, 205, 0.2);
      margin-top: 0.4rem;
    }

    .project-link {
      color: #a78bfa;
      text-decoration: none;
      font-weight: 500;
      padding: 0.4rem 1.2rem;
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 40px;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    .project-link:hover {
      background: rgba(167, 139, 250, 0.15);
      border-color: #a78bfa;
    }

    /* =============================================
       板块二：图片展示柜（独立毛玻璃卡片）
       ============================================= */
    .gallery-card {
      max-width: 800px;
      width: 100%;
      padding: 2.5rem 2.5rem 2.8rem;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(12px) saturate(180%);
      -webkit-backdrop-filter: blur(12px) saturate(180%);
      border-radius: 48px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.8);
      margin-bottom: 2rem;
    }

    .gallery-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .gallery-header h2 {
      font-size: 1.8rem;
      font-weight: 600;
      background: linear-gradient(to right, #f0f0ff, #b7b7ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .gallery-header p {
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.95rem;
      margin-top: 0.2rem;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      aspect-ratio: 1 / 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.3s ease;
    }

    .gallery-item:hover {
      transform: translateY(-4px) scale(1.02);
      border-color: rgba(167, 139, 250, 0.4);
      box-shadow: 0 12px 30px -10px rgba(167, 139, 250, 0.2);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
    }

    .gallery-item .overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 1rem 0.8rem 0.8rem;
      background: linear-gradient(transparent, rgba(0, 0, 0, 0.7));
      color: #fff;
      font-size: 0.8rem;
      font-weight: 500;
      transform: translateY(100%);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .gallery-item:hover .overlay {
      transform: translateY(0);
    }

    .gallery-item .overlay small {
      display: block;
      font-weight: 400;
      font-size: 0.65rem;
      color: rgba(255, 255, 255, 0.6);
    }

    .empty-state {
      text-align: center;
      padding: 2.5rem 1rem;
      color: rgba(255, 255, 255, 0.4);
      grid-column: 1 / -1;
    }
    .empty-state .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    /* ===== 灯箱 ===== */
    .lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      cursor: pointer;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 16px;
      object-fit: contain;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
      animation: zoomIn 0.3s ease;
    }

    @keyframes zoomIn {
      0% { transform: scale(0.9); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .lightbox .close-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.35);
      font-size: 0.8rem;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* ===== 返回首页 ===== */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.6);
      text-decoration: none;
      font-weight: 500;
      padding: 0.6rem 1.5rem;
      border-radius: 40px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s ease;
    }

    .back-link:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* ===== 响应式 ===== */
    @media (max-width: 600px) {
      .glass-card, .gallery-card {
        padding: 1.8rem 1.2rem;
        border-radius: 32px;
      }
      h1 {
        font-size: 1.8rem;
      }
      .gallery-header h2 {
        font-size: 1.5rem;
      }
      .project-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.8rem;
      }
      .project-link {
        align-self: flex-start;
      }
      .gallery-grid {
        grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <!-- =============================================
       板块一：项目列表
       ============================================= -->
  <div class="glass-card">
    <h1>📂 我的项目</h1>
    <p class="subhead">一些正在构建和探索的东西</p>

    <div class="project-item">
      <div class="project-info">
        <h3>个人启动页</h3>
        <p>一个带有动态粒子背景和毛玻璃效果的品牌页</p>
        <span class="project-tag">HTML / CSS / Canvas</span>
      </div>
      <a href="/" class="project-link">查看 →</a>
    </div>

    <div class="project-item">
      <div class="project-info">
        <h3>（你的下一个项目）</h3>
        <p>这里可以放你的第二个项目描述</p>
        <span class="project-tag">标签</span>
      </div>
      <a href="#" class="project-link">查看 →</a>
    </div>

    <div class="project-item">
      <div class="project-info">
        <h3>（你的第三个项目）</h3>
        <p>简单介绍这个项目是做什么的</p>
        <span class="project-tag">标签</span>
      </div>
      <a href="#" class="project-link">查看 →</a>
    </div>
  </div>

  <!-- =============================================
       板块二：图片展示柜
       ============================================= -->
  <div class="gallery-card">
    <div class="gallery-header">
      <h2>🖼️ 图片展示柜</h2>
      <p>点击图片放大查看</p>
    </div>

    <div class="gallery-grid" id="galleryGrid">
      <!-- 由 JavaScript 动态生成 -->
    </div>
  </div>

  <!-- ===== 返回首页 ===== -->
  <a href="/" class="back-link">← 返回首页</a>

  <!-- ===== 灯箱 ===== -->
  <div class="lightbox" id="lightbox">
    <img id="lightboxImg" src="" alt="放大查看" />
    <span class="close-hint">点击任意处关闭</span>
  </div>

  <script>
    // =============================================
    // 1. 图片列表 —— 在这里添加你的图片
    // =============================================
    const images = [
      // 示例图片（换成你自己的）
      // { src: '/bg.jpg', title: '背景图', desc: '主页背景' },
      // { src: '/photo1.jpg', title: '照片 1', desc: '生活记录' },
      // { src: '/screenshot1.png', title: '截图 1', desc: '项目预览' },
    ];

    // =============================================
    // 2. 渲染图片网格
    // =============================================
    const grid = document.getElementById('galleryGrid');

    if (images.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <p>还没有图片</p>
          <p style="font-size:0.8rem;margin-top:0.3rem;">在 images 数组里添加图片链接</p>
        </div>
      `;
    } else {
      grid.innerHTML = images.map((img, index) => `
        <div class="gallery-item" data-index="${index}">
          <img src="${img.src}" alt="${img.title}" loading="lazy" />
          <div class="overlay">
            ${img.title}
            <small>${img.desc || ''}</small>
          </div>
        </div>
      `).join('');
    }

    // =============================================
    // 3. 灯箱功能
    // =============================================
    const lightbox = document.getElementById('lightbox');
    const lightboxImg = document.getElementById('lightboxImg');

    document.querySelectorAll('.gallery-item').forEach((item) => {
      item.addEventListener('click', () => {
        const img = item.querySelector('img');
        lightboxImg.src = img.src;
        lightboxImg.alt = img.alt;
        lightbox.classList.add('active');
        document.body.style.overflow = 'hidden';
      });
    });

    lightbox.addEventListener('click', () => {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        lightbox.classList.remove('active');
        document.body.style.overflow = '';
      }
    });
  </script>

</body>
</html>
